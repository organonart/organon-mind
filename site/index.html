<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organon Mind</title>
  <meta name="description" content="Because we need to see what it&rsquo;s doing, not just what it says.">

  <!-- No analytics, no cookies, no external requests. One page, self-contained. -->

  <link rel="icon" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Organon Mind">
  <meta property="og:title" content="Organon Mind">
  <meta property="og:description" content="Because we need to see what it&rsquo;s doing, not just what it says.">
  <meta property="og:url" content="https://organonmind.org/">
  <meta name="twitter:card" content="summary">
  <style>
    :root {
      --bg: #0e0d0b;
      --ink: #ece4d6;
      --faint: #6b6355;
      --accent: #d9c7a0;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f3ea;
        --ink: #1d1a15;
        --faint: #8a8172;
        --accent: #7a6a45;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      /* svh, not vh: mobile browser chrome must not throw off the centring. */
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 36rem;
      padding: 3rem 1.5rem;
      width: 100%;
    }

    .wordmark {
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 0 0 3.4rem;
      text-indent: 0.42em;
    }

    /* The line. It carries the page, so it gets the weight and the room. */
    .line {
      font-size: clamp(1.9rem, 6.2vw, 2.9rem);
      line-height: 1.22;
      font-weight: 600;
      letter-spacing: -0.011em;
      margin: 0;
      text-wrap: balance;
    }
    .line .turn {
      display: block;
      color: var(--accent);
      font-weight: 400;
      font-style: italic;
    }

    @media (max-width: 30rem) {
      body { font-size: 18px; }
      .wordmark { margin-bottom: 2.6rem; }
    }
  </style>
</head>
<body>
  <main>
    <p class="wordmark">Organon Mind</p>

    <h1 class="line">
      Because we need to see what it&rsquo;s doing,
      <span class="turn">not just what it says.</span>
    </h1>
  </main>
</body>
</html>
