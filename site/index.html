<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organon Mind</title>
  <meta name="description" content="Organon Mind.">

  <!-- No analytics, no cookies, no external requests. One page, self-contained. -->

  <link rel="icon" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Organon Mind">
  <meta property="og:title" content="Organon Mind">
  <meta property="og:url" content="https://organonmind.org/">
  <meta name="twitter:card" content="summary">
  <style>
    /* Tokens shared with the publications (OM-001). Deliberately single-theme:
       the pages have a canonical appearance and do not follow the reader's
       operating system. Every colour is painted explicitly. */
    :root{
      --paper:#ffffff;
      --ink:#0f1114;
      --faint:#8b919b;
      --sans:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      --mono:ui-monospace,"Cascadia Mono","SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    }

    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      /* svh, not vh: mobile browser chrome must not throw off the centring. */
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:3rem 1.5rem;
    }

    /* The wordmark is the page. Same treatment as the masthead on every
       publication, scaled up — monospace, uppercase, widely tracked — so the
       identity is one element used consistently rather than a logo. */
    .wordmark{
      font-family:var(--mono);
      font-size:clamp(.82rem,2.6vw,1.05rem);
      letter-spacing:.42em;
      text-transform:uppercase;
      margin:0;
      /* letter-spacing adds a trailing space after the final glyph; the indent
         puts it back so the mark is optically centred rather than measured. */
      text-indent:.42em;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">Organon Mind</h1>
  </main>
</body>
</html>
