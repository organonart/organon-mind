<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organon Mind</title>
  <meta name="description" content="Organon Mind.">

  <!-- No analytics, no cookies, no external requests. One page, self-contained. -->

  <link rel="icon" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Organon Mind">
  <meta property="og:title" content="Organon Mind">
  <meta property="og:url" content="https://organonmind.org/">
  <meta name="twitter:card" content="summary">
  <style>
    /* Tokens shared with the publications (OM-001). Deliberately single-theme:
       the pages have a canonical appearance and do not follow the reader's
       operating system. Every colour is painted explicitly. */
    :root{
      --paper:#ffffff;
      --ink:#0f1114;
      --faint:#8b919b;
      --rule:#e2e5e9;
      --link:#1440c4;
      --sans:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      --mono:ui-monospace,"Cascadia Mono","SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    }

    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:var(--sans);
      font-size:17px;
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      /* svh, not vh: mobile browser chrome must not throw off the centring. */
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:4rem 1.5rem;
    }
    main{width:100%;max-width:26rem}

    /* Same treatment as the masthead on every publication — monospace,
       uppercase, widely tracked — so the identity is one element used
       consistently rather than a logo. */
    .wordmark{
      font-family:var(--mono);
      font-size:.78rem;
      letter-spacing:.32em;
      text-transform:uppercase;
      margin:0 0 2.6rem;
    }

    /* The page says nothing about itself. It is a way in, not an explanation:
       the catalogue and the papers, named, and no description of the programme
       around them. The catalogue's line is the name of the whole collection —
       it must never restate a single paper's title, which is what it did while
       the catalogue held only OM-001's patterns. */
    .index{list-style:none;margin:0;padding:0}
    .index li{border-top:1px solid var(--rule)}
    .index li:last-child{border-bottom:1px solid var(--rule)}
    .index a{
      display:block;
      padding:.95rem 0;
      text-decoration:none;
      color:inherit;
    }
    .index a:hover .title,
    .index a:focus-visible .title{
      text-decoration:underline;
      text-decoration-color:var(--link);
      text-underline-offset:3px;
    }
    .index a:focus-visible{outline:2px solid var(--link);outline-offset:3px}
    .label{
      display:block;
      font-family:var(--mono);
      font-size:.68rem;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--faint);
      margin-bottom:.2rem;
    }
    .title{font-weight:600;letter-spacing:-.008em}
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">Organon Mind</h1>

    <ul class="index">
      <li>
        <a href="/patterns">
          <span class="label">Catalogue</span>
          <span class="title">Design Patterns for Working with Agents</span>
        </a>
      </li>
      <li>
        <a href="/om-001">
          <span class="label">OM-001 · Paper</span>
          <span class="title">Conversational Agent Control Surfaces</span>
        </a>
      </li>
      <li>
        <a href="/om-002">
          <span class="label">OM-002 · Paper</span>
          <span class="title">Working with Many Agents</span>
        </a>
      </li>
      <li>
        <a href="/om-003">
          <span class="label">OM-003 · Paper</span>
          <span class="title">Arrangements, and Many Teams</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
